plugins {
    id 'com.android.application'
}

android {
    namespace 'com.uwright.wiredistro'
    compileSdk 36

    defaultConfig {
        applicationId 'com.uwright.wiredistro'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-github'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
