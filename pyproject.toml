[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wrightlywired-mlos"
version = "0.1.0"
description = "WrightlyWired MLOS"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mlos-server = "mlos.api.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["mlos*", "pydantic"]
